[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textdeblur"
version = "1.0.0"
description = "Text-aware PSF estimation for blind motion deblurring of license plates and low-texture text"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Inesh Roy" },
  { name = "Maithily Gauravkumar Bhala" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "pillow>=10.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
demo = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["textdeblur*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
